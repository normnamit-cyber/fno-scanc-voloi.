name: FNO Scan C Vol/OI Alert

on:
  schedule:
    # Three overlapping sessions instead of two — shorter individual
    # connections are less likely to need to survive hours unbroken, and
    # the overlap means if one drops early (like the WebSocket disconnect
    # we saw), another session is already covering that gap.
    - cron: "40 3 * * 1-5"   # 9:10 AM IST
    - cron: "10 6 * * 1-5"   # 11:40 AM IST
    - cron: "30 8 * * 1-5"   # 2:00 PM IST
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the shared "already alerted" state file

jobs:
  run-scan-c:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # safety cap — real work stops at ~200 min itself

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scan C bot
        env:
          PYTHONUNBUFFERED: "1"
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
